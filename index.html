<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RepliPlate — restaurant favorites, made at home</title>
  <meta name="description" content="Clone restaurant favorites at home. See what you save, plan your week with AI, build one grocery list, and share plans with family.">
  <meta name="theme-color" content="#EEF1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1713" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RepliPlate">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:title" content="RepliPlate">
  <meta property="og:description" content="Restaurant favorites, made at home for a fraction of the price.">
  <meta property="og:image" content="assets/store/feature-graphic.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-48.png" sizes="48x48">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = localStorage.getItem('rp.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/discover" aria-label="RepliPlate home">
      <img src="assets/logo.svg" alt="" width="32" height="32">
      <b>RepliPlate</b>
    </a>
    <span class="net" id="net" hidden>Offline</span>
    <button class="btn-install" id="installBtn" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>
      Install
    </button>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <nav class="nav" aria-label="Main">
    <a href="#/discover" data-tab="discover">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/></svg></span>Clones
    </a>
    <a href="#/plan" data-tab="plan">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M8 14h3M8 17h6"/></svg></span>Plan
    </a>
    <a href="#/list" data-tab="list">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h2l1.6 9.2a2 2 0 0 0 2 1.8h7.2a2 2 0 0 0 2-1.6L20 10H7"/><circle cx="10" cy="21" r=".6"/><circle cx="17" cy="21" r=".6"/></svg></span>List
      <span class="badge" id="listBadge" hidden></span>
    </a>
    <a href="#/saved" data-tab="saved">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V21l-6.5-4.5L5.5 21V4.5a1 1 0 0 1 1-1Z"/></svg></span>Saved
    </a>
  </nav>

  <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
  <noscript><p style="padding:24px">RepliPlate needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
